name: keepalive
# 03/10/2026 : GitHub désactive les workflows planifiés après 60 jours
# d'inactivité du dépôt. Ce bot fait un commit vide chaque lundi pour garder
# le dépôt "actif" et le témoin temoin-homelab éternellement armé.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: depot actif, planificateur temoin garde arme"
          git push
