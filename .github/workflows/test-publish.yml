name: test-ntfy-publish
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: POST vers topic test (pas le secret)
        run: |
          code=$(curl -s -m 15 -o /tmp/body.txt -w "%{http_code}" -X POST -H "Title: test-runner" -d "publish depuis runner github" https://ntfy.sh/homelab-vivant-test-2371)
          echo "HTTP $code"
          head -c 300 /tmp/body.txt
          [ "$code" = "200" ] || exit 1
